<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 起名</title>
<style>
  body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 26px; }
  label { display: block; margin: 16px 0 6px; font-weight: 600; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; }
  textarea { min-height: 110px; resize: vertical; }
  button { margin-top: 20px; padding: 11px 24px; font-size: 16px; border: 0; border-radius: 8px; background: #111; color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #result { margin-top: 24px; padding: 18px; border: 1px solid #e5e5e5; border-radius: 10px; background: #fafafa; white-space: pre-wrap; line-height: 1.8; min-height: 120px; }
  #status { margin-top: 12px; color: #888; font-size: 14px; }
</style>
</head>
<body>
<h1>AI 起名</h1>
<p>说清楚用途和想要的感觉，AI 会流式给出 3 组名字，每组附带寓意解释。</p>

<label for="category">起名用途</label>
<select id="category">
  <option value="宝宝起名">宝宝起名</option>
  <option value="品牌起名">品牌起名</option>
  <option value="店铺起名">店铺起名</option>
  <option value="产品起名">产品起名</option>
  <option value="其他">其他</option>
</select>

<label for="surname">姓氏（可选，宝宝起名时用）</label>
<input id="surname" placeholder="例如：陈" />

<label for="style">风格偏好（可选）</label>
<input id="style" placeholder="例如：温润、有诗意、不要生僻字" />

<label for="prompt">起名需求</label>
<textarea id="prompt" placeholder="例如：给一家新式茶饮品牌起名，面向年轻人，清新、好记、带一点东方感"></textarea>

<button id="go">开始起名</button>
<div id="status"></div>
<div id="result">结果会在这里逐字出现……</div>

<script>
  const $ = (id) => document.getElementById(id);

  $("go").addEventListener("click", async () => {
    const prompt = $("prompt").value.trim();
    if (!prompt) { $("status").textContent = "请先输入起名需求。"; return; }

    $("go").disabled = true;
    $("result").textContent = "";
    $("status").textContent = "正在起名……";

    try {
      const res = await fetch("/api/name", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          prompt,
          category: $("category").value,
          surname: $("surname").value.trim(),
          style: $("style").value.trim(),
        }),
      });

      // 非流式错误（例如未配置 Key）直接返回 JSON
      if (!res.ok && res.headers.get("content-type")?.includes("application/json")) {
        const err = await res.json();
        $("status").textContent = err.error || "请求失败";
        $("go").disabled = false;
        return;
      }
      if (!res.body) throw new Error("浏览器不支持流式读取");

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf("\n\n")) >= 0) {
          const chunk = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          for (const line of chunk.split("\n")) {
            if (!line.startsWith("data:")) continue;
            const event = JSON.parse(line.slice(5).trim());
            if (event.delta) $("result").textContent += event.delta;
            if (event.error) $("status").textContent = event.error;
            if (event.done) $("status").textContent = "已完成，结果已保存。";
          }
        }
      }
    } catch (err) {
      $("status").textContent = "请求失败：" + err.message;
    } finally {
      $("go").disabled = false;
    }
  });
</script>
</body>
</html>
